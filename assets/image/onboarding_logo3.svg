<svg viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg" width="400" height="380">
  <!-- Background circle -->
  <ellipse cx="200" cy="195" rx="155" ry="148" fill="#EEF0FF"/>

  <!-- Phone base (flat, face up, bottom center) -->
  <rect x="130" y="270" width="140" height="80" rx="18" fill="#1A1A2E"/>
  <rect x="140" y="278" width="120" height="64" rx="12" fill="#F4F5FF"/>

  <!-- Photo card (top left floating) -->
  <g transform="rotate(-12, 130, 170)">
    <rect x="68" y="110" width="90" height="75" rx="12" fill="white" filter="url(#shadow1)"/>
    <rect x="68" y="110" width="90" height="48" rx="12" fill="#B0AAFF" opacity="0.55"/>
    <!-- Mountain icon -->
    <polygon points="88,148 108,122 128,148" fill="#7C6FF7" opacity="0.8"/>
    <polygon points="113,148 127,130 141,148" fill="#9990F5" opacity="0.6"/>
    <circle cx="127" cy="122" r="7" fill="#FFD700" opacity="0.9"/>
    <!-- Text lines below image -->
    <rect x="76" y="163" width="56" height="7" rx="3" fill="#D0CDFF"/>
    <rect x="76" y="175" width="38" height="6" rx="3" fill="#E2E0FF"/>
  </g>

  <!-- Mic / voice note card -->
  <g transform="rotate(8, 240, 175)">
    <rect x="215" y="130" width="105" height="50" rx="14" fill="white" stroke="#E8E6FF" stroke-width="2"/>
    <!-- Mic icon -->
    <circle cx="238" cy="155" r="14" fill="#FF6B8A"/>
    <rect x="233" y="148" width="10" height="14" rx="5" fill="white"/>
    <path d="M229,158 Q229,167 238,167 Q247,167 247,158" stroke="white" stroke-width="2" fill="none"/>
    <line x1="238" y1="167" x2="238" y2="172" stroke="white" stroke-width="2"/>
    <!-- Waveform bars -->
    <rect x="260" y="158" width="5" height="6" rx="2" fill="#B0AAFF"/>
    <rect x="269" y="151" width="5" height="14" rx="2" fill="#7C6FF7"/>
    <rect x="278" y="155" width="5" height="10" rx="2" fill="#B0AAFF"/>
    <rect x="287" y="148" width="5" height="18" rx="2" fill="#7C6FF7"/>
    <rect x="296" y="153" width="5" height="12" rx="2" fill="#B0AAFF"/>
    <rect x="305" y="157" width="5" height="7" rx="2" fill="#7C6FF7"/>
  </g>

  <!-- Document/file card -->
  <g transform="rotate(-6, 200, 240)">
    <rect x="152" y="195" width="80" height="95" rx="12" fill="white" stroke="#E8E6FF" stroke-width="2"/>
    <!-- Doc lines -->
    <rect x="165" y="215" width="54" height="7" rx="3" fill="#D0CDFF"/>
    <rect x="165" y="228" width="44" height="7" rx="3" fill="#E2E0FF"/>
    <rect x="165" y="241" width="50" height="7" rx="3" fill="#D0CDFF"/>
    <rect x="165" y="254" width="32" height="7" rx="3" fill="#E2E0FF"/>
    <!-- Doc icon corner fold -->
    <polygon points="216,196 232,196 232,212" fill="#B0AAFF" opacity="0.6"/>
  </g>

  <!-- Folder card -->
  <g transform="rotate(10, 110, 250)">
    <rect x="60" y="225" width="84" height="60" rx="10" fill="#FFB347"/>
    <rect x="60" y="214" width="38" height="18" rx="8 8 0 0" fill="#FFA020"/>
    <!-- folder lines -->
    <rect x="72" y="242" width="55" height="6" rx="3" fill="white" opacity="0.5"/>
    <rect x="72" y="254" width="40" height="6" rx="3" fill="white" opacity="0.35"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="305" cy="108" r="9" fill="#EEF0FF" stroke="#B0AAFF" stroke-width="2"/>
  <circle cx="88" cy="115" r="6" fill="#B0AAFF" opacity="0.45"/>
  <circle cx="330" cy="255" r="5" fill="#7C6FF7" opacity="0.28"/>

  <defs>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C6FF7" flood-opacity="0.12"/>
    </filter>
  </defs>
</svg>
